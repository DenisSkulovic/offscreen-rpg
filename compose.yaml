name: offscreen-rpg
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: offscreen
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: offscreen
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U offscreen -d offscreen']
      interval: 5s
      timeout: 5s
      retries: 12
  temporal:
    image: temporalio/temporal:1.9.1
    command:
      [
        'server',
        'start-dev',
        '--ip',
        '0.0.0.0',
        '--db-filename',
        '/home/temporal/temporal.db',
        '--ui-disable-news-fetch',
      ]
    ports:
      - '127.0.0.1:7233:7233'
      - '127.0.0.1:8233:8233'
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:8.2.1-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
  # Disposable S3-compatible CAS for ENG05 local adapter proofs. Not production.
  # adobe/s3mock is used because minio/minio pulls are blocked in this environment.
  s3mock:
    image: adobe/s3mock:4.9.1
    environment:
      initialBuckets: offscreen-cas
      COM_ADOBE_TESTING_S3MOCK_DOMAIN_RETAINFILES_ONEXIT: 'false'
    ports:
      - '127.0.0.1:9090:9090'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:9090/ || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
  temporal-data:
