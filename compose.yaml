name: offscreen-rpg
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: offscreen
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: offscreen
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U offscreen -d offscreen']
      interval: 5s
      timeout: 5s
      retries: 12
  temporal:
    image: temporalio/temporal:1.9.1
    command:
      [
        'server',
        'start-dev',
        '--ip',
        '0.0.0.0',
        '--db-filename',
        '/data/temporal.db',
        '--ui-disable-news-fetch',
      ]
    ports:
      - '127.0.0.1:7233:7233'
      - '127.0.0.1:8233:8233'
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
  temporal-data:
