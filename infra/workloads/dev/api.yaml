# Dev-only game-api: tsc-watch + Node inside the lab cluster.
apiVersion: v1
kind: Service
metadata:
  name: game-api
  namespace: lab-edge
  labels:
    app: game-api
    offscreen.rpg/lab: disposable
    offscreen.rpg/profile: dev
spec:
  type: ClusterIP
  selector:
    app: game-api
    offscreen.rpg/profile: dev
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-api
  namespace: lab-edge
  labels:
    app: game-api
    offscreen.rpg/lab: disposable
    offscreen.rpg/profile: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-api
      offscreen.rpg/profile: dev
  template:
    metadata:
      labels:
        app: game-api
        offscreen.rpg/lab: disposable
        offscreen.rpg/profile: dev
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: offscreen-lab-dev-workspace:dxk08-api
          imagePullPolicy: Never
          workingDir: /app
          command:
            - pnpm
            - --filter
            - "@offscreen/api"
            - run
            - dev
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "3001"
            - name: APP_ORIGIN
              value: http://127.0.0.1:3000
            - name: GAME_AUTHORITY_MODE
              value: distributed
            - name: GAME_AUTHORITY_ORIGIN
              value: http://game-authority.lab-authority.svc.cluster.local:3002
            - name: OFFSCREEN_DOCUMENT_STORE
              value: s3
            - name: OFFSCREEN_DOCUMENT_S3_BUCKET
              value: lab-objects
            - name: OFFSCREEN_DOCUMENT_S3_ENDPOINT
              value: http://object-store.lab-objects.svc.cluster.local:8333
            - name: OFFSCREEN_DOCUMENT_S3_FORCE_PATH_STYLE
              value: "true"
            - name: OFFSCREEN_DEFAULT_RULE_ROOT_HASH
              value: d643427fa3292ce61484deb15f2e9fc6755c613b17260db6f390ea23bd99d7ab
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: game-db
                  key: uri
            - name: OFFSCREEN_DOCUMENT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: access-key-id
            - name: OFFSCREEN_DOCUMENT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: secret-access-key
            - name: GAME_AUTHORITY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: game-authority-service-token
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: better-auth-secret
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: github-client-secret
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1024Mi