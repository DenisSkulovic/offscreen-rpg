# Defaults are not runnable without an explicit profile (-f profiles/*.yaml).
section: all

catalog:
  roles:
    - web
    - api
    - authority
    - control
    - executor
    - relay
  deployments:
    web: game-web
    api: game-api
    authority: game-authority
    control: game-control
    executor: game-executor
    relay: game-relay
  containers:
    web: web
    api: api
    authority: authority
    control: control
    executor: executor
    relay: relay
  httpPorts:
    web: 3000
    api: 3001
    authority: 3002
  imageFamily:
    web: web
    api: api
    authority: authority
    control: worker
    executor: worker
    relay: worker

replicas: 1
imagePullPolicy: Never
automountServiceAccountToken: false
enableServiceLinks: false

podSecurity:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
