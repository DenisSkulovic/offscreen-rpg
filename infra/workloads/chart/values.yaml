# Defaults are not runnable without an explicit profile (-f profiles/*.yaml).
section: all

catalog:
  deployments:
    web: game-web
    api: game-api
    authority: game-authority
    control: game-control
    executor: game-executor
    relay: game-relay
  containers:
    web: web
    api: api
    authority: authority
    control: control
    executor: executor
    relay: relay
  httpPorts:
    web: 3000
    api: 3001
    authority: 3002

replicas: 1
# Optional per-role overrides (release); keys: web, api, authority, control, executor, relay
# replicasByRole:
#   api: 2
#   executor: 3
imagePullPolicy: Never
automountServiceAccountToken: false
enableServiceLinks: false

podSecurity:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
