# offscreen-monitor-managed: v1
# Tracked Netdata Agent v2 settings for workstation observability.
# Operator installs the native package; this file is copied only via install.sh.

[global]
    run as user = netdata
    send anonymous statistics = no
    telemetry enabled = no

[cloud]
    enabled = no

[db]
    db = dbengine
    update every = 1
    storage tiers = 3
    tier 0 retention size = 1GiB
    tier 0 retention time = 3d
    tier 1 retention size = 512MiB
    tier 1 retention time = 30d
    tier 2 retention size = 512MiB
    tier 2 retention time = 90d

[web]
    bind to = 127.0.0.1
    port = 19999
    allow connections from = localhost
    allow connections from = 127.0.0.1

[registry]
    enabled = no