# Disposable lab Redis. Acceleration only: no snapshot, no append-only file, no authentication material.
# The Service is ClusterIP. A restart or flush drops keys and is not a loss of game state.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: lab-a
  labels:
    app: redis
    offscreen.rpg/lab: disposable
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    port 6379
    appendonly no
    save ""
    dir /data
    maxmemory 32mb
    maxmemory-policy allkeys-lru
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: lab-a
  labels:
    app: redis
    offscreen.rpg/lab: disposable
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        offscreen.rpg/lab: disposable
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis:8.2.1-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "/config/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: redis-config
        - name: data
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: lab-a
  labels:
    app: redis
    offscreen.rpg/lab: disposable
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
