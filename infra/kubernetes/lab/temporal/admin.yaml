# CLI pod for history inspection. It does not run a game workflow and it does not publish a host port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-admin
  namespace: lab-temporal
  labels:
    app: temporal-admin
    offscreen.rpg/lab: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-admin
  template:
    metadata:
      labels:
        app: temporal-admin
        offscreen.rpg/lab: disposable
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: docker.io/temporalio/admin-tools:1.32.2
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-server:7233
            - name: TEMPORAL_NAMESPACE
              value: default
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 192Mi
