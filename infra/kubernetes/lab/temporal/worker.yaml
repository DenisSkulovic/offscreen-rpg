# Toy worker for labOnce. It is not a game workflow and it does not use the game task queue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-once-worker
  namespace: lab-temporal
  labels:
    app: lab-once-worker
    offscreen.rpg/lab: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-once-worker
  template:
    metadata:
      labels:
        app: lab-once-worker
        offscreen.rpg/lab: disposable
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: offscreen-lab-temporal-worker:k8s06
          imagePullPolicy: IfNotPresent
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-server:7233
            - name: EFFECT_HOST
              value: temporal-postgres
            - name: EFFECT_USER
              value: temporal
            - name: EFFECT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-db
                  key: password
            - name: NODE_OPTIONS
              value: --max-old-space-size=384
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 640Mi
