# Starts one labOnce execution. The workflow id is fixed so the smoke can reject a second run.
apiVersion: batch/v1
kind: Job
metadata:
  name: lab-once-start
  namespace: lab-temporal
  labels:
    app: lab-once-start
    offscreen.rpg/lab: disposable
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: lab-once-start
        offscreen.rpg/lab: disposable
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: start
          image: offscreen-lab-temporal-worker:k8s06
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/start.mjs"]
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-server:7233
            - name: WORKFLOW_ID
              value: lab-once
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 384Mi
