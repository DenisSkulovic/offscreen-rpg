# Dev-only game-web: Next dev + Fast Refresh inside the lab cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-edge
  labels:
    offscreen.rpg/lab: disposable
---
apiVersion: v1
kind: Service
metadata:
  name: game-web
  namespace: lab-edge
  labels:
    app: game-web
    offscreen.rpg/lab: disposable
    offscreen.rpg/profile: dev
spec:
  type: ClusterIP
  selector:
    app: game-web
    offscreen.rpg/profile: dev
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-web
  namespace: lab-edge
  labels:
    app: game-web
    offscreen.rpg/lab: disposable
    offscreen.rpg/profile: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-web
      offscreen.rpg/profile: dev
  template:
    metadata:
      labels:
        app: game-web
        offscreen.rpg/lab: disposable
        offscreen.rpg/profile: dev
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: offscreen-lab-dev-workspace:dxk08
          imagePullPolicy: Never
          workingDir: /app
          command:
            - pnpm
            - --filter
            - "@offscreen/web"
            - exec
            - next
            - dev
            - --hostname
            - "0.0.0.0"
            - --port
            - "3000"
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: API_PROXY_ORIGIN
              value: http://game-api.lab-edge.svc.cluster.local:3001
            - name: API_INTERNAL_ORIGIN
              value: http://game-api.lab-edge.svc.cluster.local:3001
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1536Mi