# One-shot local demo seed: staff bootstrap, pinned S3 import, campaign start.
# Not apps/api startup. Identity and database settings come from cluster secrets.
apiVersion: batch/v1
kind: Job
metadata:
  name: local-demo-seed
  namespace: lab-edge
  labels:
    app: local-demo-seed
    offscreen.rpg/lab: disposable
    offscreen.rpg/role: dev-bootstrap
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: local-demo-seed
        offscreen.rpg/lab: disposable
        offscreen.rpg/role: dev-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: offscreen-lab-app-release-api:turn02
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              umask 077
              exec node scripts/repo-tools/seed-local-demo.mjs \
                --auth-user-id "$LOCAL_DEMO_AUTH_USER_ID" \
                --environment local \
                --actor-label "$LOCAL_DEMO_ACTOR_LABEL" \
                --s3
          env:
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp
            - name: LOCAL_DEMO_SEED
              value: "1"
            - name: LOCAL_DEMO_CAMPAIGN_KEY
              value: local-demo
            - name: LOCAL_DEMO_AUTH_USER_ID
              valueFrom:
                secretKeyRef:
                  name: local-demo-seed
                  key: auth-user-id
            - name: LOCAL_DEMO_ACTOR_LABEL
              valueFrom:
                secretKeyRef:
                  name: local-demo-seed
                  key: actor-label
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: game-db
                  key: uri
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: OFFSCREEN_DOCUMENT_STORE
              value: s3
            - name: OFFSCREEN_DOCUMENT_S3_BUCKET
              value: lab-objects
            - name: OFFSCREEN_DOCUMENT_S3_ENDPOINT
              value: http://object-store.lab-objects.svc.cluster.local:8333
            - name: OFFSCREEN_DOCUMENT_S3_FORCE_PATH_STYLE
              value: "1"
            - name: OFFSCREEN_DOCUMENT_S3_REGION
              value: us-east-1
            - name: OFFSCREEN_DOCUMENT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: content-importer-s3
                  key: access-key-id
            - name: OFFSCREEN_DOCUMENT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: content-importer-s3
                  key: secret-access-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir: {}