# Disposable lab collector. Debug export only. No remote backend.
# Player identifiers, story text, and secrets are not accepted by the synthetic hops.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 20
  batch:
    timeout: 200ms
    send_batch_size: 16

exporters:
  debug:
    verbosity: detailed
    sampling_initial: 50
    sampling_thereafter: 1

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
