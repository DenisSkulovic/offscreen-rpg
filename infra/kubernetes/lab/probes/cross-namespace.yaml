apiVersion: v1
kind: Pod
metadata:
  name: probe-server
  namespace: lab-b
  labels:
    app: probe-server
    offscreen.rpg/probe: smoke
spec:
  restartPolicy: Never
  enableServiceLinks: false
  containers:
    - name: http
      image: docker.io/library/busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - mkdir -p /tmp/www && echo lab-b-ok > /tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: lab-b
  labels:
    offscreen.rpg/probe: smoke
spec:
  selector:
    app: probe-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
