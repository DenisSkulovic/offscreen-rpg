apiVersion: v1
kind: Pod
metadata:
  name: pvc-reader
  namespace: lab-a
  labels:
    offscreen.rpg/probe: smoke
spec:
  restartPolicy: Never
  enableServiceLinks: false
  containers:
    - name: reader
      image: docker.io/library/busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - grep -x lab-pvc-ok /data/marker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: probe-data
