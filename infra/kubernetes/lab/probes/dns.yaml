apiVersion: v1
kind: Pod
metadata:
  name: dns-probe
  namespace: lab-a
  labels:
    offscreen.rpg/probe: smoke
spec:
  restartPolicy: Never
  enableServiceLinks: false
  containers:
    - name: dns
      image: docker.io/library/busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - nslookup kubernetes.default.svc.cluster.local && nslookup probe.lab-b.svc.cluster.local
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
