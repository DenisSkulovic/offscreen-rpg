# Storyteller control and execution workers — Temporal only, no broad database env.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-workers
  labels:
    offscreen.rpg/lab: disposable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-control
  namespace: lab-workers
  labels:
    app: game-control
    offscreen.rpg/lab: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-control
  template:
    metadata:
      labels:
        app: game-control
        offscreen.rpg/lab: disposable
        offscreen.rpg/chaos-eligible: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control
          image: offscreen-lab-app-release-worker:turn02
          imagePullPolicy: Never
          command:
            - node
            - apps/worker/dist/src/bootstrap/control-main.js
          ports:
            - name: worker
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-server.lab-temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TEMPORAL_TASK_QUEUE
              value: control
            - name: GAME_AUTHORITY_ORIGIN
              value: http://game-authority.lab-authority.svc.cluster.local:3002
            - name: GAME_AUTHORITY_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: game-authority-control-token
          readinessProbe:
            tcpSocket:
              port: worker
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 18
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-executor
  namespace: lab-workers
  labels:
    app: game-executor
    offscreen.rpg/lab: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-executor
  template:
    metadata:
      labels:
        app: game-executor
        offscreen.rpg/lab: disposable
        offscreen.rpg/chaos-eligible: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          image: offscreen-lab-app-release-worker:turn02
          imagePullPolicy: Never
          command:
            - node
            - apps/worker/dist/src/bootstrap/executor-main.js
          ports:
            - name: worker
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-server.lab-temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TEMPORAL_TASK_QUEUE
              value: storyteller-execute-v1
            - name: GAME_AUTHORITY_ORIGIN
              value: http://game-authority.lab-authority.svc.cluster.local:3002
            - name: GAME_AUTHORITY_EXECUTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: game-authority-executor-token
          readinessProbe:
            tcpSocket:
              port: worker
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 18
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi