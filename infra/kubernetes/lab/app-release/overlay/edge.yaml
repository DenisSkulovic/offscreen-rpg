# Real app release in lab-edge: game-web, game-api, and edge HTTPRoute.
# Does not replace gateway/routes.yaml synthetic fixtures.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-edge
  labels:
    offscreen.rpg/lab: disposable
---
apiVersion: v1
kind: Service
metadata:
  name: game-web
  namespace: lab-edge
  labels:
    app: game-web
    offscreen.rpg/lab: disposable
spec:
  type: ClusterIP
  selector:
    app: game-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-web
  namespace: lab-edge
  labels:
    app: game-web
    offscreen.rpg/lab: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-web
  template:
    metadata:
      labels:
        app: game-web
        offscreen.rpg/lab: disposable
        offscreen.rpg/chaos-eligible: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: offscreen-lab-game-web:turn02
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: API_PROXY_ORIGIN
              value: http://game-api.lab-edge.svc.cluster.local:3001
            - name: API_INTERNAL_ORIGIN
              value: http://game-api.lab-edge.svc.cluster.local:3001
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: game-api
  namespace: lab-edge
  labels:
    app: game-api
    offscreen.rpg/lab: disposable
spec:
  type: ClusterIP
  selector:
    app: game-api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-api
  namespace: lab-edge
  labels:
    app: game-api
    offscreen.rpg/lab: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-api
  template:
    metadata:
      labels:
        app: game-api
        offscreen.rpg/lab: disposable
        offscreen.rpg/chaos-eligible: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: offscreen-lab-app-release-api:turn02
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "3001"
            - name: APP_ORIGIN
              value: http://127.0.0.1:18080
            - name: GAME_AUTHORITY_MODE
              value: distributed
            - name: GAME_AUTHORITY_ORIGIN
              value: http://game-authority.lab-authority.svc.cluster.local:3002
            - name: OFFSCREEN_DOCUMENT_STORE
              value: s3
            - name: OFFSCREEN_DOCUMENT_S3_BUCKET
              value: lab-objects
            - name: OFFSCREEN_DOCUMENT_S3_ENDPOINT
              value: http://object-store.lab-objects.svc.cluster.local:8333
            - name: OFFSCREEN_DOCUMENT_S3_FORCE_PATH_STYLE
              value: "true"
            - name: OFFSCREEN_DEFAULT_RULE_ROOT_HASH
              value: d643427fa3292ce61484deb15f2e9fc6755c613b17260db6f390ea23bd99d7ab
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: game-db
                  key: uri
            - name: OFFSCREEN_DOCUMENT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: access-key-id
            - name: OFFSCREEN_DOCUMENT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: secret-access-key
            - name: GAME_AUTHORITY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: game-authority-service-token
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: better-auth-secret
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: game-runtime
                  key: github-client-secret
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1024Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: game-edge-routes
  namespace: lab-edge
  labels:
    offscreen.rpg/lab: disposable
spec:
  parentRefs:
    - name: lab-edge
      namespace: lab-edge
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: game-api
          port: 3001
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: game-web
          port: 3000