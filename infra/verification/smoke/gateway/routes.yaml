apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab-edge-routes
  namespace: lab-edge
  labels:
    offscreen.rpg/lab: disposable
spec:
  parentRefs:
    - name: lab-edge
      namespace: lab-edge
      sectionName: web
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/absent
      backendRefs:
        - name: absent-backend
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: synthetic-api
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /
      backendRefs:
        - name: synthetic-web
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /events
      backendRefs:
        - name: synthetic-web
          port: 8080