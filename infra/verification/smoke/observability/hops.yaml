# Two synthetic hops. They are not the API and not a worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hop-a
  namespace: lab-a
  labels:
    app: hop-a
    offscreen.rpg/lab: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hop-a
  template:
    metadata:
      labels:
        app: hop-a
        offscreen.rpg/lab: disposable
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      containers:
        - name: hop
          image: docker.io/library/python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/opt/hop/hop.py"]
          env:
            - name: ROLE
              value: a
            - name: PORT
              value: "8080"
            - name: COLLECTOR_URL
              value: http://otel-collector:4318
            - name: PEER_URL
              value: http://hop-b:8080/hop
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /opt/hop
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: synthetic-hop
---
apiVersion: v1
kind: Service
metadata:
  name: hop-a
  namespace: lab-a
  labels:
    app: hop-a
    offscreen.rpg/lab: disposable
spec:
  type: ClusterIP
  selector:
    app: hop-a
  ports:
    - name: http
      port: 8080
      targetPort: http
---
