# Short-lived client for the Redis smoke. Namespace is injected by smoke-proof.mjs.
apiVersion: v1
kind: Pod
metadata:
  name: redis-client
  labels:
    app: redis-client
    offscreen.rpg/smoke-client: disposable
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: redis
      image: docker.io/library/redis@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi