apiVersion: v1
kind: Pod
metadata:
  name: cross-ns-client
  namespace: lab-a
  labels:
    offscreen.rpg/probe: smoke
spec:
  restartPolicy: Never
  enableServiceLinks: false
  containers:
    - name: client
      image: docker.io/library/busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - i=0; while [ "$i" -lt 15 ]; do wget -qO- http://probe.lab-b.svc.cluster.local:8080/index.html && exit 0; i=$((i + 1)); sleep 2; done; exit 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
