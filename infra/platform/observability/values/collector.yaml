# DESIGN ONLY: synthetic-only admission candidate; not an application authorization boundary.
fullnameOverride: obs-collector
mode: deployment
replicaCount: 1
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: 0.165.0
command:
  name: otelcol-contrib
serviceAccount:
  automountServiceAccountToken: false
clusterRole:
  create: false
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}
ports:
  otlp: {enabled: true, hostPort: null}
  otlp-http: {enabled: true, hostPort: null}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
  metrics: {enabled: true}
alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 20
    filter/admission:
      error_mode: propagate
      trace_conditions:
        - 'resource.attributes["service.name"] != "obs-e04-probe"'
        - 'resource.attributes["deployment.environment.name"] != "synthetic"'
        - 'scope.name != "offscreen.synthetic"'
        - 'not IsMatch(resource.attributes["service.instance.id"], "^[0-9a-f]{16}$")'
        - 'span.name != "probe-parent" and span.name != "probe-child"'
        - 'not IsMatch(span.attributes["probe.run"], "^[0-9a-f]{16}$")'
      log_conditions:
        - 'resource.attributes["service.name"] != "obs-e04-probe"'
        - 'resource.attributes["deployment.environment.name"] != "synthetic"'
        - 'scope.name != "offscreen.synthetic"'
        - 'not IsMatch(resource.attributes["service.instance.id"], "^[0-9a-f]{16}$")'
        - 'not IsString(log.body)'
        - 'not IsMatch(log.body, "^obs-e04-[0-9a-f]{16}$")'
        - 'not IsMatch(log.attributes["probe.run"], "^[0-9a-f]{16}$")'
      metric_conditions:
        - 'resource.attributes["service.name"] != "obs-e04-probe"'
        - 'resource.attributes["deployment.environment.name"] != "synthetic"'
        - 'scope.name != "offscreen.synthetic"'
        - 'not IsMatch(resource.attributes["service.instance.id"], "^[0-9a-f]{16}$")'
        - 'metric.name != "offscreen_probe_events"'
        - 'metric.type != METRIC_DATA_TYPE_SUM'
        - 'metric.aggregation_temporality != AGGREGATION_TEMPORALITY_CUMULATIVE'
        - 'metric.is_monotonic != true'
        - 'not IsMatch(datapoint.attributes["probe_run"], "^[0-9a-f]{16}$")'
        - 'datapoint.value_int != 7'
    transform/sanitize:
      error_mode: propagate
      trace_statements:
        - 'keep_keys(resource.attributes, ["service.name", "deployment.environment.name", "service.instance.id"])'
        - 'keep_keys(scope.attributes, [])'
        - 'set(scope.version, "")'
        - 'keep_keys(span.attributes, ["probe.run"])'
        - 'set(span.status.message, "")'
        - 'set(span.events, nil)'
        - 'set(span.links, nil)'
        - 'set(span.trace_state, "")'
      log_statements:
        - 'keep_keys(resource.attributes, ["service.name", "deployment.environment.name", "service.instance.id"])'
        - 'keep_keys(scope.attributes, [])'
        - 'set(scope.version, "")'
        - 'keep_keys(log.attributes, ["probe.run"])'
        - 'set(log.event_name, "")'
        - 'set(log.severity_text, "INFO")'
        - 'set(log.severity_number, SEVERITY_NUMBER_INFO)'
      metric_statements:
        - 'keep_keys(resource.attributes, ["service.name", "deployment.environment.name", "service.instance.id"])'
        - 'keep_keys(scope.attributes, [])'
        - 'set(scope.version, "")'
        - 'set(metric.description, "")'
        - 'set(metric.unit, "")'
        - 'keep_keys(metric.metadata, [])'
        - 'keep_keys(datapoint.attributes, ["probe_run"])'
        - 'set(datapoint.exemplars, nil)'
    batch:
      timeout: 1s
      send_batch_size: 512
      send_batch_max_size: 1024
  exporters:
    otlp_grpc/tempo:
      endpoint: obs-tempo:4317
      tls: {insecure: true}
      timeout: 3s
      sending_queue: &queue
        enabled: true
        sizer: bytes
        queue_size: 4194304
        num_consumers: 1
        wait_for_result: false
        block_on_overflow: false
      retry_on_failure: &retry
        enabled: true
        initial_interval: 1s
        max_interval: 5s
        max_elapsed_time: 30s
    otlp_http/loki:
      endpoint: http://obs-loki:3100/otlp
      timeout: 3s
      sending_queue: *queue
      retry_on_failure: *retry
    otlp_http/prometheus:
      endpoint: http://obs-prometheus:9090/api/v1/otlp
      timeout: 3s
      sending_queue: *queue
      retry_on_failure: *retry
  service:
    extensions: [health_check]
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, filter/admission, transform/sanitize, batch]
        exporters: [otlp_grpc/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, filter/admission, transform/sanitize, batch]
        exporters: [otlp_http/prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, filter/admission, transform/sanitize, batch]
        exporters: [otlp_http/loki]
