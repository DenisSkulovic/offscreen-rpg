apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-store
  namespace: {{ .Release.Namespace }}
  labels:
{{- if eq .Values.mode "development" }}
    offscreen.dev/owner: offscreen-dev
{{- else }}
    app: object-store
    offscreen.rpg/lab: disposable
{{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: object-store
  template:
    metadata:
      labels:
        app: object-store
{{- if eq .Values.mode "development" }}
        offscreen.dev/owner: offscreen-dev
{{- else }}
        offscreen.rpg/lab: disposable
{{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
{{- if and (eq .Values.mode "development") .Values.metricsEnabled }}
          args: ["mini", "-dir=/data", "-metricsPort=9327"]
{{- else }}
          args: ["mini", "-dir=/data"]
{{- end }}
          ports:
            - name: s3
              containerPort: 8333
{{- if eq .Values.mode "release" }}
              protocol: TCP
{{- end }}
{{- if and (eq .Values.mode "development") .Values.metricsEnabled }}
            - name: metrics
              containerPort: 9327
{{- end }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-store-s3
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-s3
                  key: secret-access-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - code=$(/usr/bin/curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/); [ "$code" = "200" ] || [ "$code" = "403" ]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
{{- if eq .Values.mode "release" }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - code=$(/usr/bin/curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/); [ "$code" = "200" ] || [ "$code" = "403" ]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
{{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: object-store-data