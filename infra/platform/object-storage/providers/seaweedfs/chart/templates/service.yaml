apiVersion: v1
kind: Service
metadata:
  name: object-store
  namespace: {{ .Release.Namespace }}
  labels:
{{- if eq .Values.mode "development" }}
    offscreen.dev/owner: offscreen-dev
{{- else }}
    app: object-store
    offscreen.rpg/lab: disposable
{{- end }}
spec:
  type: ClusterIP
  selector:
    app: object-store
  ports:
    - name: s3
      port: 8333
      targetPort: s3
{{- if eq .Values.mode "release" }}
      protocol: TCP
{{- end }}