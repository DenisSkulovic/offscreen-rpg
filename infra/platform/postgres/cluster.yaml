# One disposable primary for the kind lab. The operator creates credentials
# at runtime. Do not copy those Secrets into Git.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lab-pg
  namespace: lab-postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie
  storage:
    size: 1Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  postgresql:
    parameters:
      shared_buffers: "64MB"
      max_connections: "20"
      work_mem: "4MB"
      maintenance_work_mem: "32MB"
  bootstrap:
    initdb:
      database: lab
      owner: lab
      localeCType: C
      localeCollate: C
