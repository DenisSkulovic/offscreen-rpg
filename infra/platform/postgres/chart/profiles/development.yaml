mode: development
namespace: offscreen-dev-postgres
clusterName: dev-pg
namespaceLabels:
  offscreen.dev/owner: offscreen-dev
clusterLabels:
  offscreen.dev/owner: offscreen-dev
storage:
  size: 2Gi
  storageClass: standard
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 1Gi
postgresql:
  parameters:
    shared_buffers: "128MB"
    max_connections: "100"
    work_mem: "4MB"
    maintenance_work_mem: "32MB"
bootstrap:
  initdb:
    database: dev
    owner: dev
    localeCType: C
    localeCollate: C