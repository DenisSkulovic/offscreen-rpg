# DESIGN ONLY: not deployable or selected resource settings.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dev-pg
  namespace: offscreen-dev-postgres
  labels:
    offscreen.dev/owner: offscreen-dev
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie
  enableSuperuserAccess: false
  storage:
    size: 2Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 1Gi
  postgresql:
    parameters:
      shared_buffers: "128MB"
      max_connections: "100"
      work_mem: "4MB"
      maintenance_work_mem: "32MB"
  bootstrap:
    initdb:
      database: dev
      owner: dev
      localeCType: C
      localeCollate: C
