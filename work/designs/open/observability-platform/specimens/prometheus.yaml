# DESIGN ONLY, dev profile; render and validate before any use.
rbac: {create: false}
alertmanager: {enabled: false}
kube-state-metrics: {enabled: false}
prometheus-node-exporter: {enabled: false}
prometheus-pushgateway: {enabled: false}
configmapReload:
  prometheus: {enabled: false}
server:
  fullnameOverride: obs-prometheus
  replicaCount: 1
  extraFlags: [web.enable-otlp-receiver]
  retention: 7d
  retentionSize: 3GB
  persistentVolume:
    enabled: true
    storageClass: standard
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  otlp:
    promote_resource_attributes: [deployment.environment.name, service.namespace, service.name]
  service:
    type: ClusterIP
scrapeConfigs:
  prometheus: {enabled: true}
  kubernetes-api-servers: {enabled: false}
  kubernetes-nodes: {enabled: false}
  kubernetes-nodes-cadvisor: {enabled: false}
  kubernetes-service-endpoints: {enabled: false}
  kubernetes-service-endpoints-slow: {enabled: false}
  prometheus-pushgateway: {enabled: false}
  kubernetes-services: {enabled: false}
  kubernetes-pods: {enabled: false}
  kubernetes-pods-slow: {enabled: false}
  collector:
    enabled: true
    static_configs:
      - targets: [obs-collector:8888]
