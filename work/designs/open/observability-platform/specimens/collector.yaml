# DESIGN ONLY: synthetic transport specimen; no privacy admission policy yet.
fullnameOverride: obs-collector
mode: deployment
replicaCount: 1
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: 0.165.0
command:
  name: otelcol-contrib
serviceAccount:
  automountServiceAccountToken: false
clusterRole:
  create: false
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}
ports:
  otlp: {enabled: true, hostPort: null}
  otlp-http: {enabled: true, hostPort: null}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
  metrics: {enabled: true}
alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 20
    batch:
      timeout: 1s
      send_batch_size: 512
      send_batch_max_size: 1024
  exporters:
    otlp_grpc/tempo:
      endpoint: obs-tempo:4317
      tls: {insecure: true}
      timeout: 3s
      sending_queue: &queue
        enabled: true
        sizer: bytes
        queue_size: 4194304
        num_consumers: 1
        wait_for_result: false
        block_on_overflow: false
      retry_on_failure: &retry
        enabled: true
        initial_interval: 1s
        max_interval: 5s
        max_elapsed_time: 30s
    otlp_http/loki:
      endpoint: http://obs-loki:3100/otlp
      timeout: 3s
      sending_queue: *queue
      retry_on_failure: *retry
    otlp_http/prometheus:
      endpoint: http://obs-prometheus:9090/api/v1/otlp
      timeout: 3s
      sending_queue: *queue
      retry_on_failure: *retry
  service:
    extensions: [health_check]
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/loki]
