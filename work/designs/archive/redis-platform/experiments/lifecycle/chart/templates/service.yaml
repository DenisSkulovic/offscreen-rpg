apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis.specimen.selector" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "redis.specimen.selector" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
